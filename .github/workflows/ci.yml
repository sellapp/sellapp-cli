name: CLI source CI
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.25.x'}
      - run: go test ./...
      - run: go vet ./...
      - run: test "$(jq '.operationCount' internal/catalog/commands.json)" = 434
      - run: go build -o sellapp ./cmd/sellapp
      - run: for example in examples/*.sh; do sh -n "$example"; SELLAPP_AUDIT_DISABLED=1 sh "$example"; done
      - run: go run ./tools/release -output "$RUNNER_TEMP/release"
      - run: go run ./tools/release -output "$RUNNER_TEMP/release" -verify
      - run: git diff --exit-code
